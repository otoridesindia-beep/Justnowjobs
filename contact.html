<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get in touch with Hyrnex and share your data-career profile." />
    <title>Contact us | Hyrnex</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Hyrnex home">
        <span class="brand-mark">H</span>
        <span>hyrnex</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html#jobs">Browse jobs</a>
        <a href="index.html#tips">Interview tips</a>
        <a href="pricing.html">Pricing</a>
        <a href="contact.html" aria-current="page">Contact us</a>
        <a href="index.html#about">Our approach</a>
      </nav>
      <a class="header-cta" href="index.html#jobs">Find your next role <span aria-hidden="true">↗</span></a>
      <a class="profile-button" href="index.html?account=1" aria-label="Sign in or register">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5 20c.7-3.4 3.2-5.2 7-5.2s6.3 1.8 7 5.2"></path>
        </svg>
      </a>
    </header>

    <main id="home">
      <section class="contact-section" id="contact">
        <div class="section-heading">
          <div>
            <div class="eyebrow section-eyebrow">CONTACT US</div>
            <h2>Tell us where you want <span>your career to go.</span></h2>
            <p>Share your details and resume with Hyrnex. Our team will get back to you.</p>
          </div>
        </div>
        <form class="contact-card" id="contactForm" novalidate>
          <div class="contact-fields">
            <label>Name<input id="contactName" type="text" autocomplete="name" maxlength="100" placeholder="Your full name" required /></label>
            <label>Mobile number<input id="contactMobile" type="tel" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number" required /></label>
            <label>Looking for job role<input id="contactRole" type="text" maxlength="150" placeholder="e.g. Data Analyst" required /></label>
            <label>Location<input id="contactLocation" type="text" maxlength="150" placeholder="Preferred city" required /></label>
            <label class="contact-wide">Upload resume (PDF, DOC or DOCX, up to 5 MB)<input id="contactResume" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required /></label>
          </div>
          <div class="admin-form-actions">
            <button class="admin-submit" id="contactSubmit" type="submit">Submit</button>
            <span class="admin-status" id="contactStatus" role="status" aria-live="polite"></span>
          </div>
        </form>
      </section>
    </main>
    <footer><a class="brand footer-brand" href="index.html"><span class="brand-mark">H</span><span>hyrnex</span></a><span>Connecting people with data careers.</span><div class="footer-social" aria-label="Social profiles not yet available"><span class="social-icon" role="img" aria-label="Facebook, profile not yet available"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 21v-8h3l.5-4H14V7c0-1 .4-1.5 1.6-1.5H18V2.1a19 19 0 0 0-2.8-.2C12.4 1.9 10 3.6 10 6.7V9H7v4h3v8z"></path></svg></span><span class="social-icon" role="img" aria-label="Instagram, profile not yet available"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"></rect><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle><circle cx="17.5" cy="6.5" r="1"></circle></svg></span><span class="social-icon" role="img" aria-label="LinkedIn, profile not yet available"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM3.3 9h3.4v11H3.3zM9 9h3.3v1.5h.1c.5-.9 1.6-1.8 3.4-1.8 3.6 0 4.2 2.3 4.2 5.3v6h-3.4v-5.3c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9V20H9z"></path></svg></span></div><span>© 2026 Hyrnex</span></footer>
    <script src="nav.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js" integrity="sha384-tD6X9wDfTRdKpuPoHFZrVW2RXjSYSWjLBPWXxpHprWWl9eaHlwl05aRjHsiKF97n" crossorigin="anonymous"></script>
    <script src="contact.js"></script>
  </body>
</html>
